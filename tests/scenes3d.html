<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3D 장면 점검</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding: 10px; }
  #sheet { display: grid; grid-template-columns: repeat(auto-fill, 230px); gap: 8px; }
  figure { margin: 0; }
  figure img { width: 230px; height: 230px; display: block; border-radius: 8px; background: #000; }
  figcaption { font-size: 11px; line-height: 1.3; color: var(--mute); margin-top: 2px; }
  #host { position: fixed; left: -2000px; top: 0; width: 360px; height: 360px; }
</style>
</head>
<body>
<p id="status">렌더링 중…</p>
<div id="sheet"></div>
<div id="host"></div>
<script src="../js/logic.js"></script>
<script src="../js/stage.js"></script>
<script type="module">
  // 사용법: scenes3d.html?k=deal21,clock&at=0.5,1  (at: 단계 진행 비율 목록, 1은 마지막 장면)
  const P = await import('../js/proto3d.js');
  const q = new URLSearchParams(location.search);
  const keys = q.get('k') ? q.get('k').split(',') : Object.keys(P.SCENARIOS);
  const marks = (q.get('at') || '0.5,1').split(',').map(Number);
  const host = document.getElementById('host');
  const sheet = document.getElementById('sheet');
  const errors = [];
  for (const key of keys) {
    let s;
    try {
      s = await P.mount(host, key, {});
    } catch (e) {
      errors.push(`${key}: ${e.message}`);
      continue;
    }
    const total = s.position.total;
    for (const m of marks) {
      const target = Math.min(total - 1, Math.floor((total - 1) * m));
      let guard = 0;
      while (s.position.index < target && guard++ < 6000) s.advance(50);
      s.advance(m >= 1 ? 1500 : 700);
      const say = document.querySelector('#say')?.textContent || '';
      const img = new Image();
      img.src = s.canvas.toDataURL('image/png');
      const fig = document.createElement('figure');
      fig.innerHTML = `<figcaption>${key} · ${s.position.index + 1}/${total}</figcaption>`;
      fig.prepend(img);
      sheet.appendChild(fig);
    }
    s.destroy();
  }
  document.getElementById('status').textContent = errors.length ? errors.join(' / ') : `완료 ${keys.length}개`;
  window.done = { errors, count: keys.length };
</script>
</body>
</html>
